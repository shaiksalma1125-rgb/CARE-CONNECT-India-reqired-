# Spring Boot Application Properties - SIH 2026 (SIH26133)
server.port=8080
spring.application.name=public-healthcare-service

# Database Configuration (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/public_healthcare_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=rootpassword
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring SQL init
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# JWT Security Config
app.jwt.secret=9a4f2c8d3b7a1e6f5c8d0b2a4e6f8a1c3e5b7d9f1a3c5e7b9d1f3a5c7e9b1d3f
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173
